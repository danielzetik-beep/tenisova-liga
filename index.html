<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tenisová liga táta &amp; syn</title>
<style>
  :root { --bg:#0f5132; --card:#ffffff; --accent:#ffc107; --ink:#212529; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#e8f5ec; color:var(--ink); }
  header { background:var(--bg); color:#fff; padding:16px 24px; text-align:center; }
  header h1 { margin:0; font-size:1.4rem; }
  header p { margin:4px 0 0; opacity:.85; font-size:.9rem; }
  main { max-width:1100px; margin:0 auto; padding:20px 16px 60px; }
  section { background:var(--card); border-radius:12px; padding:18px 20px; margin-bottom:20px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  h2 { margin-top:0; font-size:1.1rem; color:var(--bg); }
  .reg-form { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .reg-form label { display:flex; flex-direction:column; font-size:.8rem; gap:4px; flex:1; min-width:160px; }
  input, button { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid #ccc; }
  button { background:var(--bg); color:#fff; border:none; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  button.secondary { background:#6c757d; }
  button.danger { background:#dc3545; }
  button:disabled { background:#adb5bd; cursor:not-allowed; }
  .teams { list-style:none; padding:0; margin:14px 0 0; display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:8px; }
  .teams li { background:#f1f8f4; border:1px solid #d5e8dc; border-radius:8px; padding:8px 12px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .teams li button { padding:2px 8px; font-size:.8rem; }
  table { border-collapse:collapse; width:100%; font-size:.92rem; }
  th, td { padding:8px 10px; text-align:center; border-bottom:1px solid #eef4f0; }
  th { background:#f1f8f4; color:var(--bg); }
  td:first-child, th:first-child { text-align:left; }
  tr.leader td { background:#fff8e1; font-weight:700; }
  .match { border:1px solid #d5e8dc; border-radius:10px; background:#fbfdfb; padding:10px 12px; margin-bottom:10px; }
  .match .pair { display:flex; justify-content:space-between; gap:8px; font-weight:600; margin-bottom:8px; flex-wrap:wrap; }
  .match .pair .winner { color:#b8860b; }
  .score-line { display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:.85rem; margin-top:6px; }
  .score-line input[type=number] { width:52px; }
  .score-line input[type=date] { flex:1; min-width:130px; }
  .score-line .lbl { color:#6c757d; }
  .played-date { font-size:.78rem; color:#6c757d; margin-top:4px; }
  .msg { padding:8px 12px; border-radius:8px; margin-top:10px; font-size:.9rem; display:none; }
  .msg.error { display:block; background:#f8d7da; color:#842029; }
  .msg.ok { display:block; background:#d1e7dd; color:#0f5132; }
  .note { font-size:.85rem; color:#6c757d; }
</style>
</head>
<body>
<header>
  <h1>🎾 Tenisová liga táta &amp; syn</h1>
  <p>Liga každý s každým – registrace dvojic, zadávání výsledků (2 sety + tie-break) a tabulka.</p>
</header>
<main>
  <section id="regSection">
    <h2>Registrace dvojice</h2>
    <div class="reg-form">
      <label>Jméno táty <input id="father" placeholder="např. Petr"></label>
      <label>Jméno syna <input id="son" placeholder="např. Honza"></label>
      <button onclick="addTeam()">Registrovat</button>
    </div>
    <div id="msg" class="msg"></div>
    <ul id="teamList" class="teams"></ul>
    <p class="note" id="regNote"></p>
    <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
      <button id="adminToggle" class="secondary" onclick="toggleAdmin()">🔒 Admin</button>
      <span id="adminControls" style="display:none; gap:10px; flex-wrap:wrap; align-items:center;">
        <button id="schedBtn" onclick="createSchedule()">Vytvořit zápasy (každý s každým)</button>
        <button class="danger" onclick="resetAll()">Vymazat vše a začít znovu</button>
      </span>
    </div>
    <div id="adminPanel" style="display:none; margin-top:10px;">
      <div class="reg-form">
        <label>Admin PIN <input id="pin" type="password" placeholder="PIN"></label>
        <button onclick="unlockAdmin()">Odemknout</button>
      </div>
    </div>
  </section>

  <section id="tableSection" style="display:none;">
    <h2>Tabulka</h2>
    <table id="standings">
      <thead>
        <tr><th>Tým</th><th>Zápasy</th><th>Výhry</th><th>Prohry</th><th>Sety</th><th>Gemy</th><th>Body</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <p class="note">Za výhru jsou 2 body. Řazení: body, rozdíl setů, rozdíl gemů.</p>
  </section>

  <section id="matchesSection" style="display:none;">
    <h2>Zápasy</h2>
    <div id="matchList"></div>
  </section>
</main>

<script>
let state = null;
let adminUnlocked = false;

async function api(path, options) {
  const res = await fetch(path, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Chyba serveru");
  return data;
}

function showMsg(text, ok) {
  const el = document.getElementById("msg");
  el.textContent = text;
  el.className = "msg " + (ok ? "ok" : "error");
}

async function refresh() {
  state = await api("/api/state");
  render();
}

async function addTeam() {
  const father = document.getElementById("father").value;
  const son = document.getElementById("son").value;
  try {
    state = await api("/api/teams", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({father, son})
    });
    document.getElementById("father").value = "";
    document.getElementById("son").value = "";
    showMsg("Dvojice zaregistrována.", true);
    render();
  } catch (e) { showMsg(e.message, false); }
}

function toggleAdmin() {
  const p = document.getElementById("adminPanel");
  p.style.display = p.style.display === "none" ? "block" : "none";
}

async function unlockAdmin() {
  const pin = document.getElementById("pin").value;
  try {
    await api("/api/admin", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({pin})
    });
    adminUnlocked = true;
    window.__pin = pin;
    document.getElementById("pin").value = "";
    showMsg("Admin odemčen.", true);
    render();
  } catch (e) { showMsg(e.message, false); }
}

async function removeTeam(id) {
  try {
    state = await api("/api/teams/" + id + "/delete", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({pin: document.getElementById("pin").value || window.__pin || ""})
    });
    showMsg("Tým odebrán.", true);
    render();
  } catch (e) { showMsg(e.message, false); }
}

async function createSchedule() {
  try {
    state = await api("/api/schedule", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({pin: window.__pin || ""})
    });
    showMsg("Zápasy vytvořeny – každý hraje s každým!", true);
    render();
  } catch (e) { showMsg(e.message, false); }
}

async function saveResult(id) {
  const g = (k) => document.getElementById(k + "-" + id).value;
  try {
    state = await api("/api/match/" + id + "/result", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        s1a: g("s1a"), s1b: g("s1b"), s2a: g("s2a"), s2b: g("s2b"),
        tb1: g("tb1"), tb2: g("tb2"), played: g("d")
      })
    });
    showMsg("Výsledek uložen.", true);
    render();
  } catch (e) { showMsg(e.message, false); }
}

async function clearResult(id) {
  try {
    state = await api("/api/match/" + id + "/clear", {method: "POST"});
    showMsg("Výsledek smazán.", true);
    render();
  } catch (e) { showMsg(e.message, false); }
}

async function resetAll() {
  if (!confirm("Opravdu vymazat všechny týmy, zápasy i výsledky?")) return;
  try {
    state = await api("/api/reset", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({pin: window.__pin || ""})
    });
    showMsg("Vše vymazáno, můžete začít nový turnaj.", true);
    render();
  } catch (e) { showMsg(e.message, false); }
}

function teamName(t) {
  return t ? t.father + " & " + t.son : "—";
}

function scoreText(m) {
  if (m.s1a === null) return "";
  let s = m.s1a + ":" + m.s1b + ", " + m.s2a + ":" + m.s2b;
  if (m.tb1 !== null) s += " (TB " + m.tb1 + ":" + m.tb2 + ")";
  return s;
}

function render() {
  const list = document.getElementById("teamList");
  list.innerHTML = "";
  for (const t of state.teams) {
    const li = document.createElement("li");
    const span = document.createElement("span");
    span.textContent = t.father + " & " + t.son;
    li.appendChild(span);
    if (!state.scheduled && adminUnlocked) {
      const btn = document.createElement("button");
      btn.className = "danger";
      btn.textContent = "Odebrat";
      btn.onclick = () => removeTeam(t.id);
      li.appendChild(btn);
    }
    list.appendChild(li);
  }
  document.getElementById("adminControls").style.display = adminUnlocked ? "inline-flex" : "none";
  document.getElementById("regNote").textContent =
    "Registrováno týmů: " + state.teams.length + " / " + state.maxTeams +
    (state.scheduled ? " — registrace uzavřena (zápasy vytvořeny)." : (state.teams.length >= state.maxTeams ? " — turnaj je plný." : "."));
  document.getElementById("schedBtn").disabled = state.scheduled || state.teams.length < 2;

  document.getElementById("tableSection").style.display = state.scheduled ? "block" : "none";
  document.getElementById("matchesSection").style.display = state.scheduled ? "block" : "none";

  if (state.scheduled) {
    const tbody = document.querySelector("#standings tbody");
    tbody.innerHTML = "";
    state.standings.forEach((r, i) => {
      const tr = document.createElement("tr");
      if (i === 0 && r.played > 0) tr.className = "leader";
      tr.innerHTML = "<td>" + teamName(r.team) + "</td><td>" + r.played + "</td><td>" + r.wins +
        "</td><td>" + r.losses + "</td><td>" + r.sets + "</td><td>" + r.games + "</td><td>" + r.points + "</td>";
      tbody.appendChild(tr);
    });

    const ml = document.getElementById("matchList");
    ml.innerHTML = "";
    for (const m of state.matches) {
      ml.appendChild(renderMatch(m));
    }
  }
}

function renderMatch(m) {
  const div = document.createElement("div");
  div.className = "match";
  const w1 = m.winner_id === m.team1.id;
  const w2 = m.winner_id === m.team2.id;
  const pair = document.createElement("div");
  pair.className = "pair";
  const decided = m.s1a !== null;
  pair.innerHTML =
    '<span class="' + (w1 ? "winner" : "") + '">' + teamName(m.team1) + "</span>" +
    '<span>' + (decided ? scoreText(m) : "—") + "</span>" +
    '<span class="' + (w2 ? "winner" : "") + '">' + teamName(m.team2) + "</span>";
  div.appendChild(pair);

  const row = document.createElement("div");
  row.className = "score-line";
  row.innerHTML =
    '<span class="lbl">Set 1:</span>' +
    '<input type="number" min="0" id="s1a-' + m.id + '" value="' + (m.s1a ?? "") + '">' +
    '<span>:</span>' +
    '<input type="number" min="0" id="s1b-' + m.id + '" value="' + (m.s1b ?? "") + '">' +
    '<span class="lbl">Set 2:</span>' +
    '<input type="number" min="0" id="s2a-' + m.id + '" value="' + (m.s2a ?? "") + '">' +
    '<span>:</span>' +
    '<input type="number" min="0" id="s2b-' + m.id + '" value="' + (m.s2b ?? "") + '">' +
    '<span class="lbl">TB (při 1:1):</span>' +
    '<input type="number" min="0" id="tb1-' + m.id + '" value="' + (m.tb1 ?? "") + '">' +
    '<span>:</span>' +
    '<input type="number" min="0" id="tb2-' + m.id + '" value="' + (m.tb2 ?? "") + '">' +
    '<input type="date" id="d-' + m.id + '" value="' + (m.played || "") + '" title="Datum zápasu">' +
    '<button onclick="saveResult(' + m.id + ')">Uložit</button>' +
    (decided ? '<button class="secondary" onclick="clearResult(' + m.id + ')">Smazat</button>' : '');
  div.appendChild(row);
  if (m.played) {
    const d = document.createElement("div");
    d.className = "played-date";
    d.textContent = "Hráno: " + m.played;
    div.appendChild(d);
  }
  return div;
}

refresh();
</script>
</body>
</html>
